<!DOCTYPE html>
<html>
    <head>
        <title>Saul Goodman &amp; Associates - Signup</title>
        <meta name="viewport" content="width=device-width">
        <meta charset="UTF-8">
        <meta name="description" content="Official Website of Saul Goodman & Associates">
        <meta name="keywords" content="Saul Goodman, Legal Services, Jimmy McGill">                                                                                                                                                                                                                                                                                                                                                 
        <link rel="stylesheet" href="../CSS/styles.css">
    </head>
    <body>
        <header>
            <h1>Saul Goodman &amp; Associates - Signup</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li id="signupItem"><a href="signup.html">Signup</a></li>
                    <li><a href="login.html" id="loginLink">Login</a></li>
                    <li id="signOutItem" hidden><a href="index.html" id="signOut">Sign Out</a></li>
                </ul>
            </nav>
        </header>
        <div class="content">
            <h1>Create an Account</h1>
            <form id="signupForm" class="signup_box" method="POST">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Your username">

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Your password">

                <label for="confPassword">Confirm Password</label>
                <input type="password" id="confPassword" name="confPassword" placeholder="Confirm Password">

                <button type="submit">Create Account</button>
                <p id="signupMessage" hidden></p>
            </form>
        </div>
        <script src="../JS/scripts.js"></script>
    </body>
</html>
