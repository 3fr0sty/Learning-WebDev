<!DOCTYPE html>
<html>
    <head>
        <title>Saul Goodman &amp; Associates - Contact</title>
        <meta
            name="viewport"
            content="width=device-width"
        />
        <link rel="stylesheet" href="../CSS/styles.css">
    </head>
    <body>
        <header>
            <h1>Saul Goodman &amp; Associates - Contact</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li id="signupItem"><a href="signup.html">Signup</a></li>
                    <li><a href="login.html" id="loginLink">Login</a></li>
                    <li id="signOutItem" hidden><a href="index.html" id="signOut">Sign Out</a></li>
                </ul>
            </nav>
        </header>
        <div class="content">
            <h1>Contact</h1>
            <div class="listone">
                <h3>Get in touch</h3>
                <ul>
                    <li>Email: jamesmcgill@hhmlegal.com</li>
                    <li>Feel free to reach out for a FREE CONSULTATION!.</li>
                </ul>
            </div>
            <form id="contactForm" class="get_in_touch">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com">

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" placeholder="Your message"></textarea>

                <button type="submit">Send</button>
                <p id="formMessage" hidden></p>
            </form>
        </div>
        <script src="../JS/scripts.js"></script>
    </body>
</html>
