<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login | The World's Most Secure Website</title>
        <link rel="stylesheet" href="../CSS/styles.css">
    </head>
    <body>
        <main id="app" class="login-page">
            <h1 :hidden="isHidden" style="color:white;">{{ message }}</h1>
            <section class="login-card" aria-labelledby="login-title">
                <p class="eyebrow">Private access</p>
                <h1 id="login-title">Welcome back</h1>
                <p class="intro">Sign in to continue to your account.</p>

                <form ref="loginForm" @submit.prevent="submitForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input id="username" name="username" type="text" v-model="username" autocomplete="username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" v-model="password" autocomplete="current-password" required>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label" for="remember-me">
                            <input id="remember-me" name="remember-me" type="checkbox">
                            Remember me
                        </label>
                        <a href="#">Forgot password?</a>
                    </div>

                    <button type="submit">Log in</button>
                </form>

                <p v-if="submitted" class="success-message">Welcome, {{ submittedName }}.</p>
                <p class="signup-prompt">New here? <a href="#">Create an account</a></p>
            </section>

            
        </main>

        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <script src="../JS/scripts.js"></script>
    </body>
</html>
